<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Home | Player Matching</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body>
    <!-- Profile completion banner — fixed to top of screen -->
    <div class="top-banner" id="completionBanner" style="display:none;">
        <div class="banner-icon"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="banner-text">
            <strong>Welcome! Complete your profile</strong>
            <span>Fill in your details so you can find and join the right squad.
                <a href="profile.html">Go to Profile &rarr;</a></span>
        </div>
        <div class="banner-actions">
            <button class="banner-close" id="closeBanner" aria-label="Dismiss">
                <i class="fas fa-times"></i>
            </button>
            <button class="banner-never-show" id="neverShowBanner" aria-label="Never show again">
                Never show again
            </button>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>SQUAD UP</h2>
            </div>

            <div class="sidebar-nav">
                <a href="home.html" class="nav-item active">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>

                <div class="nav-item-group">
                    <a href="friends.html" class="nav-item" id="friends-link">
                        <i class="fas fa-user-friends"></i>
                        <span>Friends</span>
                    </a>
                    <div class="dropdown-menu">
                        <a href="friends.html#all" class="dropdown-item">All Friends</a>
                        <a href="friends.html#pending" class="dropdown-item">
                            Pending Requests
                            <span class="badge-sm" id="sidebar-pending-badge" style="display:none;"></span>
                        </a>
                    </div>
                </div>

                <a href="squads.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>My Squads</span>
                </a>

                <a href="chat.html" class="nav-item">
                    <i class="fas fa-comments"></i>
                    <span>Chat</span>
                </a>

                <a href="events.html" class="nav-item">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Events</span>
                </a>
            </div>

            <div class="profile-section">
                <a href="profile.html" class="nav-item profile-tab">
                    <div class="avatar">
                        <img src="https://ui-avatars.com/api/?name=?&background=0D8ABC&color=fff" alt="Profile"
                            id="sidebar-avatar-img">
                    </div>
                    <div class="profile-tab-labels">
                        <span class="profile-tab-title">My Profile</span>
                        <span class="profile-tab-username" id="sidebar-username"></span>
                    </div>
                </a>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content home-main">

            <div class="search-hero">
                <h1>FIND YOUR SQUAD</h1>
                <p>Search for a game to join the battle</p>

                <div class="search-bar-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="homeSearchInput" class="search-input"
                        placeholder="Search for games (e.g. Valorant, Apex, COD)..." readonly onclick="openSearchModal()" style="cursor:pointer;">
                </div>

                <div class="trending-tags" id="trendingTagsContainer">
                    <span class="trending-label"><i class="fas fa-fire" style="color:#ff6b35;"></i> Trending:</span>
                    <span class="trending-loading" id="trendingLoading" style="color:var(--text-muted);font-size:0.85rem;">Loading...</span>
                </div>
            </div>



        </main>
    </div>

    <!-- ── Full-Screen Search Filter Modal ─────────────────── -->
    <div class="modal-overlay" id="searchFilterModal" style="display:none;">
        <div class="search-modal-content">
            <button class="modal-close-btn" style="position:absolute; top:2rem; right:3rem; font-size: 2rem;" onclick="closeSearchModal()">
                <i class="fas fa-times"></i>
            </button>
            <div class="search-modal-header">
                <h2>FILTER SQUADS</h2>
                <div class="search-bar-container" style="max-width: 800px;">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="modalSearchInput" class="search-input" placeholder="Type a squad name or game..." oninput="applyFilters()">
                </div>
                
                <div class="filter-section" style="display: flex; flex-direction: row; flex-wrap: nowrap; gap: 1.5rem; justify-content: center; align-items: center; margin-top: 1.5rem; margin-bottom: 2rem; width: 100%;">
                    <select id="filter-game" class="pf-select" style="width: 250px; min-width: 200px; max-width: 45%;" onchange="applyFilters()">
                        <option value="">Games</option>
                        <!-- Populated by JS -->
                    </select>

                    <select id="filter-language" class="pf-select" style="width: 250px; min-width: 200px; max-width: 45%;" onchange="applyFilters()">
                        <option value="">Languages</option>
                        <!-- Populated by JS -->
                    </select>
                </div>
            </div>

            <div class="search-modal-results">
                <div class="squads-grid" id="modal-squads-grid" style="width: 100%; max-width: 1200px; padding: 0 2rem; margin: 0 auto;"></div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="script.js"></script>
    <script src="home.js"></script>
    <script>
        (function () {
            const userJson = sessionStorage.getItem('squadup_user');
            const isLoggedIn = !!(userJson && sessionStorage.getItem('squadup_token'));
            const isDismissed = !!sessionStorage.getItem('squadup_banner_dismissed');

            // Profile is "complete" if the user has at least a bio OR a game tag
            let isComplete = false;
            if (userJson) {
                try {
                    const u = JSON.parse(userJson);
                    isComplete = !!(u.bio && u.bio.trim()) || (Array.isArray(u.gameTags) && u.gameTags.length > 0);
                } catch (_) { }
            }

            const banner = document.getElementById('completionBanner');
            const closeBtn = document.getElementById('closeBanner');
            const neverShowBtn = document.getElementById('neverShowBanner');
            const appContainer = document.getElementById('appContainer');

            function showBanner() {
                banner.style.display = 'flex';
                const h = banner.offsetHeight;
                appContainer.style.marginTop = h + 'px';
                appContainer.style.height = 'calc(100vh - ' + h + 'px)';
            }

            function hideBanner() {
                banner.style.display = 'none';
                appContainer.style.marginTop = '0';
                appContainer.style.height = '100vh';
            }

            if (isLoggedIn && !isComplete && !isDismissed && banner) {
                showBanner();
            }

            if (closeBtn) closeBtn.addEventListener('click', function () {
                hideBanner();
                sessionStorage.setItem('squadup_banner_dismissed', '1');
            });

            if (neverShowBtn) neverShowBtn.addEventListener('click', function () {
                hideBanner();
                // Store dismissal in sessionStorage (clears on browser close — appropriate since
                // user can still complete profile in a fresh session)
                sessionStorage.setItem('squadup_banner_dismissed', 'permanent');
            });
        })();
    </script>
</body>

</html>
