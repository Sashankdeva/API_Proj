# ─────────────────────────────────────────────────────────────────────
#  MySQL profile:  mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
#  The database is created on first start. Credentials come from the
#  DB_USERNAME / DB_PASSWORD environment variables (defaults: root / root).
# ─────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:squadup}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.h2.console.enabled=false
