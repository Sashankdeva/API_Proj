# ─────────────────────────────────────────────────────────────────────
#  MySQL profile:  mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
#  The database is created on first start. Credentials come from the
#  DB_USERNAME (default: root) / DB_PASSWORD environment variables. There is no default
#  password: until DB_PASSWORD is set, signing in to MySQL fails.
# ─────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:squadup}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.h2.console.enabled=false
