# ─────────────────────────────────────────────────────────────────────
#  "dev" profile: local convenience only. Active by default (spring.profiles.default),
#  switched off as soon as another profile is chosen.
# ─────────────────────────────────────────────────────────────────────
# H2 web console at /h2-console (JDBC URL jdbc:h2:file:./data/squadup, user sa, no password)
spring.h2.console.enabled=true
# The page may also be opened from another origin (VS Code Live Server, file://)
squadup.cors.allowed-origins=*
# 20 demo players (password = username), 18 squads, friendships and chat on an empty database
squadup.seed.enabled=true
