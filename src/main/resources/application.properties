# ─────────────────────────────────────────────────────────────────────
#  SquadUp - Player Matching Platform
#  Embedded H2 database (no installation needed).
#  Nothing here is meant for a public server: the H2 console and the demo data are only
#  switched on by the "dev" profile, which applies when no other profile is chosen
#  (see application-dev.properties). Choosing any profile, e.g. --spring.profiles.active=mysql,
#  turns them off; use  --spring.profiles.active=dev,mysql  to keep them with MySQL.
# ─────────────────────────────────────────────────────────────────────
spring.application.name=squadup
server.port=${PORT:5500}
spring.profiles.default=dev
# Behind a reverse proxy, set  server.forward-headers-strategy=native  (e.g. as an environment variable
# SERVER_FORWARD_HEADERS_STRATEGY) so that rate limits and lockouts see the real client address.
# Leave it unset when the app is reachable directly: the X-Forwarded-For header could be forged.

# ── Database (H2 file database, kept in ./data) ─────────────────────
spring.datasource.url=jdbc:h2:file:./data/squadup;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ─────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Loads lazy collections (squad members, game tags) in batches instead of one query per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ── Spring Data web: ?page=&size=&sort= ─────────────────────────────
spring.data.web.pageable.max-page-size=100

# ── SOAP (Spring WS) ────────────────────────────────────────────────
spring.webservices.path=/soap
spring.webservices.servlet.init.transformWsdlLocations=true

# ── Jackson ─────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Application settings ────────────────────────────────────────────
squadup.seed.enabled=false
squadup.auth.token-ttl=24h
squadup.chat.max-length=2000
squadup.chat.banned-words=idiot,stupid,loser
squadup.aop.slow-threshold-ms=500

# ── Logging (details in logback-spring.xml) ─────────────────────────
logging.level.root=INFO
logging.level.com.squadup=INFO
# Shows the @Before / @AfterReturning advice of LoggingAspect in the console.
logging.level.com.squadup.aop.LoggingAspect=DEBUG
