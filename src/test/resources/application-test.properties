# Test profile: fresh in-memory database per test context, no demo data.
# A unique name per Spring context, so cached test contexts never share (or drop) each other's tables.
spring.datasource.url=jdbc:h2:mem:squadup-${random.uuid};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
squadup.seed.enabled=false
logging.level.com.squadup=INFO
logging.level.com.squadup.aop.LoggingAspect=DEBUG
